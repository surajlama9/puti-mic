name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: unzip -o puti-mic.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle 8.9 Wrapper
        run: gradle wrapper --gradle-version 8.9
        working-directory: ./puti-mic

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ./puti-mic

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: puti-mic/app/build/outputs/apk/debug/app-debug.apk
