name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract ZIP File
        run: unzip -o puti-mic.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK with System Gradle
        run: gradle assembleDebug --no-daemon --warning-mode none
        working-directory: ./puti-mic

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: puti-mic/app/build/outputs/apk/debug/app-debug.apk
